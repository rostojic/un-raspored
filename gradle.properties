# Project-wide Gradle settings.

# Increase JVM heap for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX (not the legacy support library).
android.useAndroidX=true

# Kotlin code style for the Kotlin plugin.
kotlin.code.style=official

# Only keep the resources actually used per variant.
android.nonTransitiveRClass=true

# Enable Gradle configuration/build caching for faster incremental builds.
org.gradle.caching=true
org.gradle.configuration-cache=true
